<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>char_Counter</title>
    <link rel="stylesheet" type="text/css" href="index.css">
</head>
<body>
    <div class="container">
        <h2>Real Time Char Counter</h2>
        <textarea id="text_area" class="text_Area"
        placeholder="Please write your text here.."
        ></textarea>
        <div class="counter">
            <p>
                Total Character:
               <span id="total_char" class="total_Char"></span>
            </p>
            <p>
                Reamaining Character:
               <span id="remaining_char" class="reamaining_Char"></span>
            </p>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
